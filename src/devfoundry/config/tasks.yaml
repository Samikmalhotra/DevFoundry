analyze_requirements:
  description: >
    IMPORTANT:
    Artifacts are the only source of truth.

    ```
    INPUT:
    Requirements:
    {requirements}

    REQUIRED OUTPUT FILE:
    artifacts/requirements.json

    CRITICAL OUTPUT REQUIREMENTS:
    - You MUST create exactly: artifacts/requirements.json
    - Do NOT create requirements_spec.json
    - Do NOT create requirements.md
    - Do NOT create any alternative filename
    - The task is not complete until artifacts/requirements.json exists

    ARTIFACT CONTRACT:
    - Persist the artifact using WriteFileTool
    - Verify the file was successfully written
    - The artifact is the authoritative source for downstream tasks

    REQUIRED CONTENT:
    - Functional requirements
    - Non-functional requirements
    - Assumptions
    - Risks
    - Constraints
    - Acceptance criteria
    - Edge cases
    - Open questions

    STRUCTURED OUTPUT RULES:
    - Follow the RequirementsSpec schema exactly
    - Output must be valid JSON
    - No markdown
    - No code fences
    - No explanatory text

    FINAL RESPONSE:
    Return only:
    SUCCESS
    Created:
    artifacts/requirements.json
    ```

  expected_output: >
    SUCCESS
    Created:
    artifacts/requirements.json

  agent: requirements_analyst

design_architecture:
  description: >
    IMPORTANT:
    Artifacts are the only source of truth.

    ```
    REQUIRED INPUT FILE:
    artifacts/requirements.json

    REQUIRED OUTPUT FILE:
    artifacts/architecture.json

    CRITICAL OUTPUT REQUIREMENTS:
    - Read artifacts/requirements.json using ReadFileTool
    - You MUST create exactly: artifacts/architecture.json
    - Do NOT create architecture_spec.json
    - Do NOT create system_design.json
    - Do NOT create architecture.md
    - Do NOT create any alternative filename
    - The task is not complete until artifacts/architecture.json exists

    ARTIFACT CONTRACT:
    - Verify artifacts/requirements.json exists before proceeding
    - Persist output using WriteFileTool
    - Verify output file exists

    STRUCTURED OUTPUT RULES:
    - Follow ArchitectureSpec exactly
    - Output must be valid JSON
    - No markdown
    - No code fences
    - No explanatory text

    FINAL RESPONSE:
    Return only:
    SUCCESS
    Created:
    artifacts/architecture.json
    ```

  expected_output: >
    SUCCESS
    Created:
    artifacts/architecture.json

  agent: architecture_lead

  context:
    - analyze_requirements

