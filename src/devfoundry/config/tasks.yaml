implement_backend:
  description: >
    IMPORTANT:
    Artifacts are the only source of truth.

    ```
    REQUIRED INPUT FILES:
    - artifacts/requirements.json
    - artifacts/architecture.json
    - artifacts/architecture_review.json

    REQUIRED OUTPUT LOCATION:
    src/**

    CRITICAL OUTPUT REQUIREMENTS:
    - Read all required artifacts using ReadFileTool
    - Do not rely on manager summaries
    - Do not rely on task context
    - Generate production-quality source code
    - Write all source files using WriteFileTool

    IMPLEMENTATION RULES:
    - Follow architecture exactly
    - Implement all required modules
    - Implement APIs
    - Implement data models
    - Implement business logic
    - Avoid placeholders
    - Avoid TODOs

    FINAL RESPONSE:
    Return only:
    SUCCESS
    Created:
    src/
    ```

  expected_output: >
    SUCCESS
    Created:
    src/

  agent: backend_engineer

  context:
    - design_architecture
    - review_architecture

