analyze_requirements:
  description: >
    AAnalyze the provided requirements and create the requirements artifact.

    Requirements:
    {requirements}

    Produce a file called requirements.json which contains:
      - Functional requirements
      - Non-functional requirements
      - Assumptions
      - Risks
      - Constraints
      - Acceptance criteria
      - Edge cases
      - Open questions


    MANDATORY Output:
    artifacts/requirements.json

  expected_output: >
    requirements.json created
  agent: requirements_analyst

design_architecture:
  description: >
    Create architecture.json from requirements.json.
    artifacts/requrements.json is your only source of truth, read it and then answer

    Input:
    artifacts/requirements.json

    Output:
    artifacts/architecture.json

  expected_output: >
    architecture.json created

  agent: architecture_lead
  # context:
  #   - analyze_requirements

review_architecture:
  description: >
    Create architecture_review.json from architecture.json.
    artifacts/architecture.json is your only source of truth, read it and then answer

    Input:
    artifacts/architecture.json

    Output:
    artifacts/architecture_review.json

  expected_output: >
    architecture_review.json created

  agent: architecture_reviewer
  # context:
  #   - analyze_requirements
  #   - design_architecture


implement_backend:
  description: >
    Create source code from architecture artifacts.
    Artifacts are your only source of truth.
    IMPORTANT: only focus on the artifacts to get context

    Input:
    artifacts/requirements.json
    artifacts/architecture.json
    artifacts/architecture_review.json

    Output:
    src/

  expected_output: >
    implementation completed

  agent: backend_engineer
  # context:
  #   - analyze_requirements
  #   - design_architecture
  #   - review_architecture

review_code:
  description: >
    Create code_review.json from generated source code.
    The generated src/ folder is your only source of truth.

    Input:
    src/

    Output:
    artifacts/code_review.json

  expected_output: >
    code review completed

  agent: code_reviewer
  # context:
  #   - implement_backend

create_tests:
  description: >
    Create automated tests for the implementation.
    The generated src/ folder is your only source of truth.
    Input:
    src/

    Output:
    tests/

  expected_output: >
    tests generated
  agent: test_engineer
  # context:
  #   - implement_backend

validate_build:
  description: >
    Execute validation and create validation_report.json.
    Analyze build execution results.

    IMPORTANT:
    - Do not assume build logs exist.
    - Do not assume test reports exist.

    Input:
    src/
    tests/

    Output:
    artifacts/validation_report.json

    Review:
      - Test results
      - Linting results
      - Type checking results
      - Runtime failures

    Produce defect reports and recommended fixes.

  expected_output: >
    artifacts/validation_report.json is created
  agent: execution_engineer
  # context:
  #   - implement_backend
  #   - create_tests

fix_implementation:
  description: >
    Resolve issues identified in reviews and validation reports.

    Input:
    artifacts/code_review.json
    artifacts/validation_report.json

    Output:
    src/

  expected_output: >
    issues resolved

  agent: backend_engineer

  # context:
  #   - review_code
  #   - validate_build

security_review:
  description: >
    Create security_review.json from the implementation.

    Input:
    src/

    Output:
    artifacts/security_review.json

  expected_output: >
    security review completed and artifacts/security_review.json is generated
  agent: security_engineer
  # context:
  #   - implement_backend

generate_ui:
  description: >
    Generate a demonstration interface for the application.

    IMPORTANT:
    - Use implementation outputs from task context.
    - Do not assume frontend files already exist.

    Preferred UI:
    {ui_framework}

    Generate all required UI source code.

  expected_output: >
    Complete frontend implementation.
  agent: ui_engineer
  context:
    - implement_backend

generate_documentation:
  description: >
    Create project documentation from all artifacts and source code.

    Input:
    artifacts/
    src/

    Output:
    README.md

    Include:
      - README
      - Architecture overview
      - Setup instructions
      - Usage examples
      - API documentation

  expected_output: >
    Complete project documentation.
  agent: technical_writer
  # context:
  #   - analyze_requirements
  #   - design_architecture
  #   - implement_backend

package_project:
  description: >
    Assemble the final deliverable.

    Produce:
      - Final project structure
      - Packaging configuration
      - Deployment assets
      - Documentation bundle

    Input:
    src/
    tests/
    artifacts/
    README.md

    Output:
    release/

  expected_output: >
    Production-ready project package.
  agent: packaging_engineer
  # context:
  #   - implement_backend
  #   - create_tests
  #   - generate_ui
  #   - generate_documentation
  #   - security_review
